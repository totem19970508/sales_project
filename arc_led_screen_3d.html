<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outer-arc LED screen 16 x 8 m - 3D model</title>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--surface:#fff;--surface-soft:#f7f9fc;--text:#14253b;--muted:#718096;--border:#e1e8f0;--accent:#078db5;--accent-dark:#0879a1;--danger:#b42336;--shadow:0 12px 32px rgba(22,48,76,.07)}
*{box-sizing:border-box}
body{margin:0;padding:28px 32px 40px;background:radial-gradient(ellipse at 82% 0%,#e4f5f8 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1800px;margin-inline:auto}
button,input{font:inherit}
.topbar{display:flex;align-items:center;gap:20px;margin:0 0 25px}
.brand-logo{width:64px;height:78px;object-fit:contain;flex:none}
.brand-copy{min-width:0}
.eyebrow,.section-label{font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(22px,3vw,30px);letter-spacing:-.035em;line-height:1.15;margin:5px 0 7px}
p.sub{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.workspace{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.sidebar{display:grid;gap:14px}
.panel,.viewer-card{background:var(--surface);border:1px solid rgba(219,228,238,.9);border-radius:16px;box-shadow:var(--shadow)}
.panel{padding:18px}
.section-label{margin:0 0 13px;color:var(--muted)}
.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-size:13px;font-weight:650;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}
button:hover{background:#f0f8fb;border-color:#aad7e3}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(7,141,181,.24);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.toggle-list{display:grid;gap:8px}
button.toggle{text-align:left;display:flex;align-items:center;justify-content:space-between}
button.toggle::after{content:"";width:8px;height:8px;border-radius:50%;background:#b6c1ce}
button.toggle.is-on{border-color:#b7e0e8;background:#eff9fb}
button.toggle.is-on::after{background:#13a37d;box-shadow:0 0 0 3px rgba(19,163,125,.12)}
.field{display:grid;gap:8px}
.field-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
label{font-size:13px;font-weight:650;color:var(--text)}
.field-hint{font-size:11px;color:var(--muted)}
.number-control{display:flex;gap:8px}
input[type=number]{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);font-size:14px}
.unit{position:relative}
.unit::after{content:"mm";position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.unit input{padding-right:40px}
.range-control{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}
#rowO{font-size:12px;font-weight:700;color:var(--accent);text-align:right}
#err{font-size:12px;color:var(--danger);min-height:16px;line-height:1.4}
.viewer-card{padding:12px}
.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 5px 12px}
.viewer-title{font-size:13px;font-weight:700}
.viewer-hint{font-size:12px;color:var(--muted)}
#c{width:100%;height:min(80vh,900px);min-height:460px;border-radius:11px;background:linear-gradient(145deg,#eef5f8,#e8edf3);touch-action:none;overflow:hidden}
#legend{display:flex;gap:8px 14px;flex-wrap:wrap;padding:16px 5px 12px;font-size:11px;color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
#info{padding:12px 13px;border-radius:10px;background:var(--surface-soft);color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:850px){body{padding:22px 18px 30px}.workspace{grid-template-columns:250px minmax(0,1fr);gap:14px}.panel{padding:14px}#c{min-height:340px}}
@media(max-width:650px){body{padding:18px 14px 24px}.topbar{gap:14px;margin-bottom:18px}.brand-logo{width:50px;height:62px}.workspace{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr 1fr}.panel{padding:14px}.sidebar .panel:last-child{grid-column:1/-1}#c{height:56vh;min-height:300px}.viewer-top{align-items:flex-start;flex-direction:column;gap:4px}}
@media(max-width:420px){.sidebar{grid-template-columns:1fr}.sidebar .panel:last-child{grid-column:auto}.button-grid{grid-template-columns:1fr 1fr}#c{min-height:280px}}
</style>
</head>

let g=null,frameOn=true,detOn=false,powOn=true,xray=false,logoOn=true,frameGroup=null,detGroup=null,powGroup=null,rowGroups=[],faces=[],zc=0,rowSel=0;
const COLS=32,ROWS=8,CW=0.5,CH=1,CD=0.1,TUBE=0.05,GAP=0.012;
const SIZES=[5,5,5,5,4,4,4];
const COL=[0xe24b4a,0xef9f27,0x97c459,0x1d9e75,0x378adf,0x7f77dd,0xd4537e];
const mA=new THREE.MeshLambertMaterial({color:0x2c3e55}),mB=new THREE.MeshLambertMaterial({color:0x35496a});
const mF=new THREE.MeshLambertMaterial({color:0x888780});
const mP=new THREE.MeshLambertMaterial({color:0xef9f27});
const mS=new THREE.MeshLambertMaterial({color:0xd3d1c7});
const fA=new THREE.MeshBasicMaterial({color:0x3f7fc4}),fB=new THREE.MeshBasicMaterial({color:0x4a90d9});
const mC=COL.map(c=>new THREE.MeshLambertMaterial({color:c}));
const tgt=new THREE.Vector3(0,4,0);
const lg=document.getElementById('legend');
SIZES.forEach((n,k)=>{lg.insertAdjacentHTML('beforeend','<span><span class="sw" style="background:#'+COL[k].toString(16).padStart(6,'0')+'"></span>C'+(k+1)+' ('+n+')</span>');});
lg.insertAdjacentHTML('beforeend','<span><span class="sw" style="background:#ef9f27"></span>Plate</span><span><span class="sw" style="background:#d3d1c7;border-radius:50%"></span>M6x30 screw</span><span><span class="sw" style="background:#888780"></span>50x50x3 tube</span>');
function setX(){[mA,mB].forEach(m=>{m.transparent=xray;m.opacity=xray?0.15:1;m.depthWrite=!xray;m.needsUpdate=true;});faces.forEach(f=>f.visible=!xray);}
function setRows(){rowGroups.forEach((r,j)=>{r.visible=(rowSel===0||rowSel===j+1);});}
function build(R){
 if(g){scene.remove(g);g.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
 g=new THREE.Group();frameGroup=new THREE.Group();detGroup=new THREE.Group();powGroup=new THREE.Group();rowGroups=[];faces=[];
 const half=(COLS*CW/2)/R;
 const sag=R*(1-Math.cos(half));
 const gc=new THREE.BoxGeometry(CW-0.006,CH-0.006,CD);
 const gf=new THREE.PlaneGeometry(CW-0.02,CH-0.02);
 const gh=new THREE.BoxGeometry(CW,TUBE,TUBE);
 const gv=new THREE.BoxGeometry(TUBE,ROWS+TUBE,TUBE);
 const gp=new THREE.BoxGeometry(0.2,0.16,GAP);
 const gs=new THREE.CylinderGeometry(0.007,0.007,0.004,10);gs.rotateX(Math.PI/2);
 const gj=new THREE.BoxGeometry(0.16,0.12,0.05);
 const ip=new THREE.InstancedMesh(gp,mP,(ROWS+1)*COLS);
 const is=new THREE.InstancedMesh(gs,mS,(ROWS+1)*COLS*4);
 const d=new THREE.Object3D();let pi=0,si=0;
 const zoff=sag/2;zc=zoff;
 const P=(i,y,off)=>{const th=(i-(COLS-1)/2)*CW/R,sn=Math.sin(th),cs=Math.cos(th);return new THREE.Vector3(R*sn-sn*off,y,R*cs-R+zoff-cs*off);};
 for(let i=0;i<COLS;i++){
  const th=(i-(COLS-1)/2)*CW/R,sn=Math.sin(th),cs=Math.cos(th);
  const px=R*sn,pz=R*cs-R+zoff;
  for(let j=0;j<ROWS;j++){
   const m=new THREE.Mesh(gc,((i+j)%2)?mA:mB);
   m.position.set(px-sn*CD/2,j+0.5,pz-cs*CD/2);m.rotation.y=th;g.add(m);
   const f=new THREE.Mesh(gf,((i+j)%2)?fA:fB);
   f.position.set(px+sn*0.002,j+0.5,pz+cs*0.002);f.rotation.y=th;g.add(f);faces.push(f);
  }
  for(let j=0;j<=ROWS;j++){
   const o=CD+GAP+TUBE/2;
   const t=new THREE.Mesh(gh,mF);
   t.position.set(px-sn*o,j,pz-cs*o);t.rotation.y=th;frameGroup.add(t);
   const op=CD+GAP/2;
   d.position.set(px-sn*op,j,pz-cs*op);d.rotation.set(0,th,0);d.updateMatrix();ip.setMatrixAt(pi++,d.matrix);
   const ys=[];if(j<ROWS)ys.push(j+0.06);if(j>0)ys.push(j-0.06);
   ys.forEach(y=>{[-0.07,0.07].forEach(dx=>{
    d.position.set(px+cs*dx+sn*0.003,y,pz-sn*dx+cs*0.003);d.rotation.set(0,th,0);d.updateMatrix();is.setMatrixAt(si++,d.matrix);
   });});
  }
 }
 is.count=si;detGroup.add(ip);detGroup.add(is);
 for(let k=0;k<=COLS;k+=4){
  const th=(k-COLS/2)*CW/R,sn=Math.sin(th),cs=Math.cos(th);
  const px=R*sn,pz=R*cs-R+zoff,o=CD+GAP+TUBE*1.5+0.01;
  const t=new THREE.Mesh(gv,mF);t.position.set(px-sn*o,ROWS/2,pz-cs*o);t.rotation.y=th;frameGroup.add(t);
 }
 const up=new THREE.Vector3(0,1,0);
 for(let j=0;j<ROWS;j++){
  const rg=new THREE.Group();let i0=0;
  SIZES.forEach((n,k)=>{
   for(let i=i0;i<i0+n;i++){
    const a=P(i,j+0.5,CD+0.02);
    if(i<i0+n-1){
     const b=P(i+1,j+0.5,CD+0.02);
     const dir=b.clone().sub(a);const len=dir.length();
     const cy=new THREE.Mesh(new THREE.CylinderGeometry(0.011,0.011,len,6),mC[k]);
     cy.position.copy(a.clone().add(b).multiplyScalar(0.5));
     cy.quaternion.setFromUnitVectors(up,dir.normalize());rg.add(cy);
    }
   }
   const th=(i0-(COLS-1)/2)*CW/R;
   const jb=new THREE.Mesh(gj,mC[k]);const q=P(i0,j+0.5,CD+0.03);jb.position.copy(q);jb.rotation.y=th;rg.add(jb);
   i0+=n;
  });
  rowGroups.push(rg);powGroup.add(rg);
 }
 frameGroup.visible=frameOn;detGroup.visible=detOn;powGroup.visible=powOn;
 g.add(frameGroup);g.add(detGroup);g.add(powGroup);scene.add(g);setX();setRows();
 const chord=2*R*Math.sin(half);
 document.getElementById('info').textContent='R '+Math.round(R*1000)+' mm, sweep '+(Math.round(half*2*180/Math.PI*10)/10)+' deg, chord '+(Math.round(chord*100)/100)+' m, depth '+(Math.round(sag*100)/100)+' m. 56 circuits of 110V 16A (7 per row, 5+5+5+5+4+4+4 cabinets), 325 W per cabinet, about 11.8 to 14.8 A per circuit. Cabinet depth 100 mm, plate/screw sizes and circuit grouping are assumed.';
}
let az=0.6,el2=0.35,dist=30;
function upd(){cam.position.set(tgt.x+dist*Math.cos(el2)*Math.sin(az),tgt.y+dist*Math.sin(el2),tgt.z+dist*Math.cos(el2)*Math.cos(az));cam.lookAt(tgt);ren.render(scene,cam);}
let drag=false,lx=0,ly=0;
const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-lx)*0.01;el2=Math.max(-0.2,Math.min(1.5,el2+(e.clientY-ly)*0.01));lx=e.clientX;ly=e.clientY;upd();});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(0.8,Math.min(60,dist*(1+e.deltaY*0.001)));upd();},{passive:false});
window.addEventListener('resize',()=>{W=el.clientWidth;H=el.clientHeight;cam.aspect=W/H;cam.updateProjectionMatrix();ren.setSize(W,H);upd();});
function view(a,e,d,t){az=a;el2=e;dist=d;tgt.set(t?t[0]:0,t?t[1]:4,t?t[2]:0);upd();}
document.getElementById('vIso').onclick=()=>view(0.6,0.35,30);
document.getElementById('vFlat').onclick=()=>view(0,0,32);
document.getElementById('vBack').onclick=()=>view(Math.PI+0.6,0.3,30);
document.getElementById('vTop').onclick=()=>view(0,1.5,28);
document.getElementById('vJoint').onclick=()=>view(Math.PI+0.4,0.15,2.2,[-3,4,zc-0.4]);
function updateToggle(button,enabled,label){button.textContent=label+' · '+(enabled?'on':'off');button.classList.toggle('is-on',enabled);button.setAttribute('aria-pressed',String(enabled));}
document.getElementById('tPow').onclick=function(){powOn=!powOn;powGroup.visible=powOn;updateToggle(this,powOn,'110V circuits');upd();};
document.getElementById('tFrame').onclick=function(){frameOn=!frameOn;frameGroup.visible=frameOn;updateToggle(this,frameOn,'Support frame');upd();};
document.getElementById('tDet').onclick=function(){detOn=!detOn;detGroup.visible=detOn;updateToggle(this,detOn,'Plates + screws');upd();};
document.getElementById('tXray').onclick=function(){xray=!xray;setX();updateToggle(this,xray,'X-ray mode');upd();};
document.getElementById('tLogo').onclick=function(){logoOn=!logoOn;logoGround.visible=logoOn;updateToggle(this,logoOn,'Ground logo');upd();};
const rs=document.getElementById('row');
rs.oninput=()=>{rowSel=parseInt(rs.value);document.getElementById('rowO').textContent=rowSel?('R'+rowSel):'All';setRows();upd();};
const rin=document.getElementById('rin'),err=document.getElementById('err');
function fromInput(){
 const v=parseFloat(rin.value);
 if(!isFinite(v)||v<5000||v>100000){err.textContent='Enter R between 5000 and 100000 mm';return;}
 err.textContent='';build(v/1000);upd();
}
document.getElementById('rset').onclick=fromInput;
rin.addEventListener('keydown',e=>{if(e.key==='Enter')fromInput();});
rin.addEventListener('input',()=>{err.textContent='';});
build(8.94);upd();
</script>
</body>
</html>
